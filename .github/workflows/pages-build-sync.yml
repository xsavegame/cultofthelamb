name: Pages Build Sync

on:
  release:
    types:
      - published
  push:
    branches:
      - experiments/**
  delete:
    branches:
      - experiments/**

permissions:
  contents: write

jobs:
  build-sync:
    name: Build And Sync gh-pages
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-sync-${{ github.repository }}-${{ github.event_name == 'release' && format('{0}-latest', github.event.repository.name) || github.event_name == 'delete' && github.event.ref || github.ref_name || 'unknown' }}
      cancel-in-progress: false
    env:
      DEFAULT_REPOSITORY_URL: https://github.com/xsavegame/cultofthelamb/
      EXPLICIT_BASE_URL: ${{ vars.VITE_APP_BASE_URL }}
      EXPLICIT_REPOSITORY_URL: ${{ vars.VITE_APP_REPOSITORY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine sync context
        id: context
        shell: bash
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          DELETE_REF_TYPE: ${{ github.event.ref_type }}
          DELETE_REF_NAME: ${{ github.event.ref }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/determine-sync-context.sh"

      - name: Exit when no work is needed
        if: steps.context.outputs.mode == 'skip'
        run: echo "No supported event payload to process."

      - name: Update release package version and move tag
        id: release
        if: steps.context.outputs.mode == 'deploy' && github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_TARGET_BRANCH: ${{ github.event.release.target_commitish }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/update-release-version-and-tag.sh"

      - name: Resolve source metadata
        id: source
        if: steps.context.outputs.mode != 'skip'
        shell: bash
        env:
          MODE: ${{ steps.context.outputs.mode }}
          INITIAL_SOURCE_REF: ${{ steps.context.outputs.source_ref }}
          INITIAL_SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
          RELEASE_SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          RELEASE_SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/resolve-source-metadata.sh"

      - name: Checkout deploy source
        if: steps.context.outputs.mode == 'deploy'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/checkout-source-sha.sh"

      - name: Setup pnpm
        if: steps.context.outputs.mode == 'deploy'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        if: steps.context.outputs.mode == 'deploy'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.context.outputs.mode == 'deploy'
        run: pnpm install --frozen-lockfile

      - name: Build metadata values
        id: build_meta
        if: steps.context.outputs.mode == 'deploy'
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/build-metadata-values.sh"

      - name: Generate contributors.json
        if: steps.context.outputs.mode == 'deploy'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: node "${GITHUB_WORKSPACE}/.github/scripts/generate-contributors-json.mjs"

      - name: Read package version
        id: version
        if: steps.context.outputs.mode == 'deploy'
        shell: bash
        env:
          PACKAGE_FILE: package.json
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/read-package-version-output.sh"

      - name: Build site
        if: steps.context.outputs.mode == 'deploy'
        env:
          VITE_GITHUB_PAGE: 'true'
          VITE_APP_BASE_URL: ${{ steps.context.outputs.base_url }}
          VITE_APP_OWNER: ${{ github.repository_owner }}
          VITE_APP_COMMIT_HASH: ${{ steps.source.outputs.source_sha }}
          VITE_APP_VERSION: ${{ steps.version.outputs.value }}
          VITE_APP_BUILT_DATE: ${{ steps.build_meta.outputs.built_date }}
          VITE_APP_REPOSITORY_URL: ${{ steps.build_meta.outputs.repository_url }}
        run: pnpm build

      - name: Prepare gh-pages worktree
        id: gh
        if: steps.context.outputs.mode != 'skip'
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/prepare-gh-pages-worktree.sh"

      - name: Apply page updates
        id: sync
        if: steps.context.outputs.mode != 'skip'
        working-directory: ${{ steps.gh.outputs.path }}
        env:
          MODE: ${{ steps.context.outputs.mode }}
          REPO_NAME: ${{ steps.context.outputs.repo_name }}
          TARGET_DIR: ${{ steps.context.outputs.target_dir }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_AUTHOR_NAME: ${{ steps.source.outputs.author_name }}
          SOURCE_AUTHOR_EMAIL: ${{ steps.source.outputs.author_email }}
          SOURCE_BRANCH_NAME: ${{ steps.context.outputs.branch_name }}
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/sync-pages-content.sh"

      - name: Push gh-pages updates
        if: steps.sync.outputs.changed == 'true'
        working-directory: ${{ steps.gh.outputs.path }}
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/push-gh-pages-with-retry.sh"

      - name: Cleanup worktree
        if: always() && steps.context.outputs.mode != 'skip'
        shell: bash
        env:
          WORKTREE_PATH: ${{ steps.gh.outputs.path }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/cleanup-worktree.sh"
